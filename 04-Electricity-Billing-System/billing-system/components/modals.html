<!-- Add Subscriber Modal -->
<div class="modal-overlay" id="add-subscriber-modal">
    <div class="modal">
        <div class="modal-header">
            <h3><i class="fas fa-user-plus"></i> إضافة مشترك جديد</h3>
            <button class="close-btn" onclick="closeModal('add-subscriber-modal')">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <form id="add-subscriber-form">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> اسم المشترك *</label>
                    <input type="text" id="new-subscriber-name" required placeholder="أدخل اسم المشترك">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-tachometer-alt"></i> رقم العداد</label>
                        <input type="text" id="new-subscriber-meter" placeholder="مثال: M-001">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-phone"></i> رقم الهاتف</label>
                        <input type="text" id="new-subscriber-phone" placeholder="مثال: 773123456">
                    </div>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-map-marker-alt"></i> العنوان</label>
                    <input type="text" id="new-subscriber-address" placeholder="أدخل العنوان">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-calendar"></i> تاريخ الاشتراك</label>
                    <input type="date" id="new-subscriber-date">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-coins"></i> الرصيد الافتتاحي</label>
                        <input type="number" id="new-subscriber-balance" value="0" step="0.01" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-bolt"></i> القراءة الافتتاحية</label>
                        <input type="number" id="new-subscriber-reading" value="0" placeholder="0">
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal('add-subscriber-modal')">إلغاء</button>
            <button class="btn btn-primary" onclick="addSubscriber()">
                <i class="fas fa-save"></i> حفظ
            </button>
        </div>
    </div>
</div>

<!-- Edit Subscriber Modal -->
<div class="modal-overlay" id="edit-subscriber-modal">
    <div class="modal">
        <div class="modal-header">
            <h3><i class="fas fa-user-edit"></i> تعديل بيانات المشترك</h3>
            <button class="close-btn" onclick="closeModal('edit-subscriber-modal')">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <form id="edit-subscriber-form">
                <input type="hidden" id="edit-subscriber-id">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> اسم المشترك *</label>
                    <input type="text" id="edit-subscriber-name" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-tachometer-alt"></i> رقم العداد</label>
                        <input type="text" id="edit-subscriber-meter">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-phone"></i> رقم الهاتف</label>
                        <input type="text" id="edit-subscriber-phone">
                    </div>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-map-marker-alt"></i> العنوان</label>
                    <input type="text" id="edit-subscriber-address">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-calendar"></i> تاريخ الاشتراك</label>
                    <input type="date" id="edit-subscriber-date">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-coins"></i> الرصيد الافتتاحي</label>
                        <input type="number" id="edit-subscriber-opening-balance" step="0.01">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-bolt"></i> القراءة الافتتاحية</label>
                        <input type="number" id="edit-subscriber-opening-reading">
                    </div>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-wallet"></i> الرصيد الحالي (للقراءة فقط)</label>
                    <input type="number" id="edit-subscriber-current-balance" readonly class="readonly-input">
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal('edit-subscriber-modal')">إلغاء</button>
            <button class="btn btn-primary" onclick="updateSubscriber()">
                <i class="fas fa-save"></i> تحديث
            </button>
        </div>
    </div>
</div>

<!-- Invoice Modal -->
<div class="modal-overlay" id="invoice-modal">
    <div class="modal modal-lg">
        <div class="modal-header">
            <h3><i class="fas fa-file-invoice"></i> الفاتورة</h3>
            <button class="close-btn" onclick="closeModal('invoice-modal')">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <div id="invoice-content" class="invoice-print"></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal('invoice-modal')">إغلاق</button>
            <button class="btn btn-primary" onclick="printInvoice()">
                <i class="fas fa-print"></i> طباعة
            </button>
        </div>
    </div>
</div>
